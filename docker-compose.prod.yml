services:
  backend:
    build:
      context: ./backend
    container_name: bullet-journal-backend
    restart: always
    environment:
      FLASK_ENV: production
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required in .env}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?JWT_SECRET_KEY is required in .env}"
      JWT_EXPIRES_HOURS: ${JWT_EXPIRES_HOURS:-24}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/bullet_journal.db}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@example.com}
      DEFAULT_ADMIN_PASSWORD: "${DEFAULT_ADMIN_PASSWORD:?DEFAULT_ADMIN_PASSWORD is required in .env}"
      AUTO_CREATE_TABLES: "false"
    volumes:
      - sqlite_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      target: prod
    container_name: bullet-journal-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PROD_FRONTEND_PORT:-80}:80"

volumes:
  sqlite_data:
