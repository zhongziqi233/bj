services:
  backend:
    build:
      context: ./backend
    container_name: bullet-journal-backend
    restart: unless-stopped
    environment:
      FLASK_ENV: development
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret}
      JWT_EXPIRES_HOURS: ${JWT_EXPIRES_HOURS:-24}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/bullet_journal.db}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@example.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-Admin123456}
      AUTO_CREATE_TABLES: "true"
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ./backend:/app
      - sqlite_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    command:
      - flask
      - --app
      - wsgi:app
      - run
      - --host=0.0.0.0
      - --port=5000
      - --debug

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: bullet-journal-frontend
    restart: unless-stopped
    environment:
      VITE_PROXY_TARGET: http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${DEV_FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  sqlite_data:
  frontend_node_modules:
