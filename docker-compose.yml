services:
  db:
    image: mysql:8.0
    container_name: bullet-journal-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bullet_journal}
      MYSQL_USER: ${MYSQL_USER:-bullet}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bullet_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_pass}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: bullet-journal-backend
    restart: unless-stopped
    environment:
      FLASK_ENV: development
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret}
      JWT_EXPIRES_HOURS: ${JWT_EXPIRES_HOURS:-24}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-bullet}:${MYSQL_PASSWORD:-bullet_pass}@db:3306/${MYSQL_DATABASE:-bullet_journal}?charset=utf8mb4
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@example.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-Admin123456}
      AUTO_CREATE_TABLES: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    command:
      - flask
      - --app
      - wsgi:app
      - run
      - --host=0.0.0.0
      - --port=5000
      - --debug

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: bullet-journal-frontend
    restart: unless-stopped
    environment:
      VITE_PROXY_TARGET: http://backend:5000
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

volumes:
  mysql_data:
  frontend_node_modules:
